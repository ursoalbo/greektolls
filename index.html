<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GreekTolls — Υπολογισμός Διοδίων Ελλάδας</title>
    <meta name="description" content="Υπολόγισε τα διόδια για το ταξίδι σου στην Ελλάδα: μοτοσυκλέτα, αυτοκίνητο, φορτηγό. Δωρεάν, χωρίς εγγραφή.">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #101216;
            --card-bg: rgba(32, 36, 42, 0.75);
            --text-main: #ffffff;
            --text-dim: #a8adb5;
            --accent-gradient: linear-gradient(135deg, #ff9f43, #ff5252);
            --accent: #ff9f43;
            --border-color: rgba(255,255,255,0.09);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px calc(30px + env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
        }
        h1 { font-size: 1.9rem; font-weight: 900; font-style: italic; letter-spacing: 2px; margin-bottom: 4px; }
        .tagline { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 25px; text-align: center; }

        .card {
            width: 100%; max-width: 600px;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            padding: 22px;
            margin-bottom: 15px;
        }
        label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

        .endpoint-row { position: relative; margin-bottom: 14px; }
        .endpoint-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .endpoint-label { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .endpoint-value { font-size: 0.92rem; color: var(--accent); font-weight: 700; max-width: 60%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .search-wrap { position: relative; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border-radius: 12px;
            border: none;
            background: rgba(0,0,0,0.35);
            color: var(--text-main);
            font-family: inherit;
        }
        input:focus { outline: 1px solid var(--accent); }
        .geo-results {
            position: absolute;
            top: calc(100% + 4px); left: 0; right: 0;
            z-index: 50;
            background: #1c2027;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .geo-result { padding: 11px 14px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); }
        .geo-result:last-child { border-bottom: none; }
        .geo-result:hover { background: rgba(255,159,67,0.1); color: var(--accent); }

        .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .quick-chip {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.25);
            color: var(--text-dim);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .quick-chip:hover { border-color: var(--accent); color: var(--accent); }

        .gps-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,213,255,0.35);
            background: transparent;
            color: #00d5ff;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .row-swap { display: flex; justify-content: center; margin: -4px 0 14px; }
        .swap-btn {
            background: rgba(255,159,67,0.12); border: 1px solid rgba(255,159,67,0.3);
            color: var(--accent); font-size: 1.15rem;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.25s;
        }
        .swap-btn:hover { transform: rotate(180deg); }

        .veh-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 14px; }
        .veh-btn {
            padding: 10px 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .veh-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .veh-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255,159,67,0.08);
        }

        .toggles { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .toggle-chip {
            padding: 9px 16px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
            display: flex; align-items: center; gap: 7px;
        }
        .toggle-chip.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255,159,67,0.08);
        }

        .go-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: var(--accent-gradient);
            color: #101216;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            box-shadow: 0 4px 18px rgba(255,159,67,0.3);
            transition: transform 0.15s;
        }
        .go-btn:active { transform: scale(0.98); }
        .go-btn:disabled { opacity: 0.55; }

        .loader { display: none; margin: 30px auto; width: 38px; height: 38px;
            border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Results */
        .results { display: none; width: 100%; max-width: 600px; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .total-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid rgba(255,159,67,0.35);
            padding: 26px 22px;
            text-align: center;
            margin-bottom: 14px;
        }
        .total-label { color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
        .total-amount { font-size: 3rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-variant-numeric: tabular-nums; }
        .route-meta { color: var(--text-dim); margin-top: 10px; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .route-meta b { color: var(--text-main); }

        .sub-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .sub-stat {
            background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color);
            padding: 14px; text-align: center;
        }
        .sub-stat .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .sub-stat .k { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }

        .station-list { list-style: none; }
        .station-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 4px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .station-item:last-child { border-bottom: none; }
        .station-name { color: var(--text-main); }
        .station-road { font-size: 0.75rem; color: var(--text-dim); display: block; }
        .station-price { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 12px; }
        .list-title { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

        .actions-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .action-pill {
            flex: 1; min-width: 130px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3);
            color: var(--text-main);
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .action-pill:hover { border-color: var(--accent); }
        .action-pill.warn { color: #ffca00; border-color: rgba(255,202,0,0.4); }

        .disclaimer { font-size: 0.78rem; color: var(--text-dim); text-align: center; max-width: 600px; margin-top: 20px; line-height: 1.5; opacity: 0.8; }
        .error-box { display:none; background: rgba(255,94,94,0.12); border: 1px solid rgba(255,94,94,0.4); color: #ff8a8a; padding: 14px; border-radius: 12px; margin-bottom: 14px; font-size: 0.92rem; }
        header { width:100%; max-width:600px; display:flex; justify-content: space-between; align-items:flex-start; }
        .lang-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-dim);
            font-weight: 700; font-size: 0.8rem; padding: 5px 12px; border-radius: 20px; cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div></div>
        <button class="lang-btn" id="langBtn">EN</button>
    </header>
    <h1>GreekTolls</h1>
    <p class="tagline" data-i18n="tagline">Υπολόγισε τα διόδια του ταξιδιού σου</p>

    <div class="card">
        <!-- FROM -->
        <div class="endpoint-row">
            <div class="endpoint-head">
                <span class="endpoint-label" data-i18n="from">Αφετηρία</span>
                <button class="gps-btn" id="gpsBtn" onclick="useGpsOrigin()" data-i18n="use_gps">📍 Τοποθεσία μου</button>
            </div>
            <div class="search-wrap">
                <input type="text" id="fromInput" autocomplete="off" placeholder="π.χ. Αθήνα…">
                <div class="geo-results" id="fromResults"></div>
            </div>
            <div class="quick-chips" id="fromQuick"></div>
        </div>

        <div class="row-swap">
            <button class="swap-btn" onclick="swapCities()" aria-label="Swap">⇅</button>
        </div>

        <!-- TO -->
        <div class="endpoint-row">
            <div class="endpoint-head">
                <span class="endpoint-label" data-i18n="to">Προορισμός</span>
            </div>
            <div class="search-wrap">
                <input type="text" id="toInput" autocomplete="off" placeholder="π.χ. Θεσσαλονίκη…">
                <div class="geo-results" id="toResults"></div>
            </div>
            <div class="quick-chips" id="toQuick"></div>
        </div>

        <label data-i18n="vehicle">Όχημα</label>
        <div class="veh-grid" id="vehGrid"></div>

        <div class="toggles">
            <button class="toggle-chip" id="roundTripBtn" onclick="toggleRoundTrip()" data-i18n="round_trip">↔ Μετ' επιστροφής</button>
            <button class="toggle-chip" id="fuelToggleBtn" onclick="toggleFuel()">⛽ Υπολογ. καυσίμων</button>
        </div>

        <div id="fuelBox" style="display:none; margin-bottom: 16px;">
            <label data-i18n="consumption">Κατανάλωση (L/100km)</label>
            <input type="number" id="consumptionInput" value="4.5" step="0.1" min="1" max="30">
            <label style="margin-top:10px;" data-i18n="fuel_price">Τιμή καυσίμου (€/L)</label>
            <input type="number" id="priceInput" value="1.80" step="0.01" min="0.5" max="3">
        </div>

        <button class="go-btn" id="calcBtn" onclick="calculate()" data-i18n="calculate">Υπολογισμός</button>
        <div class="error-box" id="errBox"></div>
    </div>

    <div class="loader" id="loader"></div>

    <div class="results" id="results">
        <div class="total-card">
            <div class="total-label" data-i18n="total_tolls">Συνολικά διόδια</div>
            <div class="total-amount" id="totalAmount">€0.00</div>
            <div class="route-meta" id="routeMeta"></div>
        </div>
        <div class="sub-stats" id="subStats"></div>
        <div class="card">
            <div class="list-title" data-i18n="stations_on_route">Σταθμοί στη διαδρομή</div>
            <ul class="station-list" id="stationList"></ul>
        </div>
        <div class="actions-row">
            <button class="action-pill" onclick="shareResult()" data-i18n="share">Μοιράσου</button>
            <a class="action-pill warn" id="reportLink" href="#" target="_blank" rel="noopener" data-i18n="report_price">Λάθος τιμή;</a>
        </div>
    </div>

    <p class="disclaimer" data-i18n="disclaimer">Ενδεικτικές τιμές μετρητά, τελευταία ενημέρωση Αύγουστος 2026. Οι τιμές μπορεί να έχουν αλλάξει — αναφέρετε ασυμφωνίες.</p>

    <script src="app.js"></script>
</body>
</html>
